<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="50" y1="2" x2="50" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <!-- Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Pin Body -->
  <g filter="url(#softGlow)">
    <path d="M 50 97 
             L 26.8 55.4 
             A 35 35 0 1 1 73.2 55.4 
             Z" 
          fill="url(#pinGrad)" 
          stroke="#bae6fd" 
          stroke-width="1.2"
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Dark Core for Voice Wave -->
  <circle cx="50" cy="38" r="23.8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="50" cy="38" r="21.4" fill="none" stroke="#0ea5e9" stroke-width="0.6" opacity="0.6"/>

  <!-- Citizen Voice Waves ("Tu voz ha llegado") -->
  <g stroke-linecap="round">
    <line x1="33.8" y1="32.5" x2="33.8" y2="43.5" stroke="#38bdf8" stroke-width="4.2"/>
    <line x1="41.9" y1="27.5" x2="41.9" y2="48.5" stroke="#67e8f9" stroke-width="4.2"/>
    <line x1="50.0" y1="22.0" x2="50.0" y2="54.0" stroke="#ffffff" stroke-width="4.2"/>
    <line x1="58.1" y1="27.5" x2="58.1" y2="48.5" stroke="#67e8f9" stroke-width="4.2"/>
    <line x1="66.2" y1="32.5" x2="66.2" y2="43.5" stroke="#38bdf8" stroke-width="4.2"/>
  </g>

  <!-- AI Constellation Nodes -->
  <g stroke="#bae6fd" stroke-width="0.5" opacity="0.8">
    <line x1="24.8" y1="28.2" x2="35.3" y2="14.2"/>
    <line x1="35.3" y1="14.2" x2="64.7" y2="14.2"/>
    <line x1="64.7" y1="14.2" x2="75.2" y2="28.2"/>
  </g>
  <circle cx="24.8" cy="28.2" r="1.3" fill="#e0f2fe"/>
  <circle cx="35.3" cy="14.2" r="1.3" fill="#e0f2fe"/>
  <circle cx="64.7" cy="14.2" r="1.3" fill="#e0f2fe"/>
  <circle cx="75.2" cy="28.2" r="1.3" fill="#e0f2fe"/>

  <!-- Apex AI Pulse Dot -->
  <circle cx="50" cy="7.6" r="1.8" fill="#ffffff" stroke="#38bdf8" stroke-width="0.5"/>
</svg>
